# ============================================================
# 应用信息
# ============================================================
spring.application.name=socker

# ============================================================
# 服务端口
# ============================================================
# 前端 Vite 开发服务器把 /api 代理到该端口（见 socker-frontend/vite.config.js）
server.port=8080

# ============================================================
# Python 分析服务
# ============================================================
# 换机器 / 换端口 / 上 Docker 时只需改这里，无需改代码
python.api.base-url=http://127.0.0.1:5000

# ============================================================
# 日志
# ============================================================
# 只把自己的包设为 DEBUG 便于排查转发问题，避免第三方库刷屏
logging.level.com.example.socker=INFO
